<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main-display"> 
        <div class="header">
            <!-- title -->
            <div>Library</div>

            <!-- for adding new books -->
            <button command="show-modal" commandfor="add-book-dialog">+</button>
            <!-- Opens the dialog -->
        </div>

        <div class="book-cards-container">
            <!-- cards will be added via js here -->
        </div>

    </div>

    <!-- The dialog for adding new books -->
    <dialog id="add-book-dialog" closedby="any">

        <form method="dialog">

            <div> 
                <label for="title">Book Title : </label>
                <input type="text" name="title" id="title" required maxlength="40" minlength="2" placeholder="e.g., A Mind For Numbers">
            </div>

            <div>
                <label for="author">Book Author : </label>
                <input type="text" name="author" id="author" required maxlength="40" minlength="2" placeholder="e.g., Barbara Oakley">
            </div>
                
            <div>
                <label for="pages-number">Number of Pages : </label>
                <input type="number" name="pages-number" id="pages-number" required max="2000" min="1" placeholder="e.g., 273"> 
            </div>    
            

            <fieldset>
                <legend>Book Reading Statue</legend>

                <div>
                    <input type="radio" name="reading-status" id="completed" value="Completed">
                    <label for="completed">Completed</label>
                </div>

                <div>
                    <input type="radio" name="reading-status" id="currently-reading" value="Currently Reading" checked >
                    <label for="currently-reading">Currently reading</label>
                </div>

                <div>
                    <input type="radio" name="reading-status" id="not-started" value="Not Started">
                    <label for="not-started">Not Started</label>
                </div>
            </fieldset>


            <button>Add</button>

        </form>
    </dialog>

</body>
</html>
